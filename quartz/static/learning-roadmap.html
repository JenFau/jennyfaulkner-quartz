<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Roadmap — Jenny Faulkner</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" />
  <script>
    // Match Quartz's saved-theme before first paint to avoid flash of wrong theme
    (function () {
      var t = localStorage.getItem("theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.dataset.theme = "dark";
      }
    }());
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Colour tokens ── */
    :root {
      --bg:     #ffffff;
      --text:   #111111;
      --accent: #C4622D;
      --border: #e8e8e8;
      --muted:  #aaaaaa;
      --card:   #ffffff;
      --subtle: #f5f5f5;
    }

    /* Dark mode — set by early-JS reading Quartz's localStorage key */
    [data-theme="dark"] {
      --bg:     #1a1a1a;
      --text:   #f0f0f0;
      --accent: #d4834d;
      --border: #2a2a2a;
      --muted:  #666666;
      --card:   #222222;
      --subtle: #242424;
    }

    /* OS-level fallback when no Quartz theme is saved */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:     #1a1a1a;
        --text:   #f0f0f0;
        --accent: #d4834d;
        --border: #2a2a2a;
        --muted:  #666666;
        --card:   #222222;
        --subtle: #242424;
      }
    }

    /* ── Base ── */
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Cabinet Grotesk", system-ui, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Site header ── */
    .site-header {
      border-bottom: 1.5px solid var(--border);
      padding: 14px 32px;
    }

    .site-header-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .site-title {
      font-family: "Cabinet Grotesk", sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .site-title:hover { color: var(--accent); }

    .site-breadcrumb {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* ── Page container ── */
    #roadmap {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 32px 80px;
    }

    /* ── Roadmap header ── */
    .rm-header {
      padding: 36px 0 28px;
      border-bottom: 1.5px solid var(--border);
    }

    .rm-eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .rm-title {
      font-family: "Clash Display", sans-serif;
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 12px;
    }

    .rm-subtitle {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── Phase selector ── */
    .phase-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 20px 0;
      border-bottom: 1.5px solid var(--border);
    }

    @media (max-width: 600px) {
      .phase-selector { grid-template-columns: repeat(2, 1fr); }
    }

    .phase-btn {
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--card);
      border-radius: 8px;
      text-align: left;
      padding: 14px 16px;
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
      color: var(--text);
    }

    .phase-btn:hover {
      border-color: var(--muted);
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transform: translateY(-1px);
    }

    .phase-btn.active { border-color: var(--pc); box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

    .pb-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .phase-btn.active .pb-label { color: var(--pc); }

    .pb-title {
      font-family: "Cabinet Grotesk", sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .phase-btn.active .pb-title { color: var(--text); }

    .pb-duration {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      color: var(--muted);
    }

    .pb-bar {
      display: none;
      margin-top: 8px;
      height: 2px;
      background: var(--pc);
      border-radius: 1px;
    }

    .phase-btn.active .pb-bar { display: block; }

    /* ── Phase panels ── */
    .rm-body { padding-top: 28px; }
    .phase-panel { display: none; }
    .phase-panel.active { display: block; }

    /* ── Phase header ── */
    .ph-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1.5px solid var(--border);
    }

    .ph-icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 8px;
      background: var(--pa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--pc);
    }

    .ph-info { flex: 1; min-width: 0; }

    .ph-title-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .ph-title {
      font-family: "Cabinet Grotesk", sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .ph-badge {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--pc);
      background: var(--pa);
      padding: 2px 10px;
      border-radius: 20px;
      border: 1.5px solid var(--pa);
      white-space: nowrap;
    }

    .ph-summary {
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.65;
      font-style: italic;
      max-width: 520px;
    }

    /* ── Track tabs ── */
    .track-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .track-btn {
      cursor: pointer;
      padding: 7px 14px;
      border-radius: 20px;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.05em;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--muted);
      transition: all 0.15s;
    }

    .track-btn.active { background: var(--pc); color: #fff; border-color: var(--pc); font-weight: 500; }
    .track-btn:not(.active):hover { border-color: var(--muted); color: var(--text); }

    /* ── Track panels ── */
    .track-panel { display: none; }
    .track-panel.active { display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px; }

    /* ── Item cards ── */
    .item-card {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background: var(--card);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .item-card:hover { border-color: var(--muted); box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
    .item-card.expanded { border-color: var(--pc); }

    .ic-header {
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      user-select: none;
    }

    .ic-left { display: flex; align-items: center; gap: 12px; }

    .ic-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      min-width: 20px;
      border-radius: 50%;
      background: var(--pa);
      font-family: "JetBrains Mono", monospace;
      font-size: 8px;
      font-weight: 500;
      color: var(--pc);
      flex-shrink: 0;
    }

    .ic-title { font-size: 14px; color: var(--text); letter-spacing: 0.01em; }

    .ic-toggle {
      color: var(--border);
      font-size: 20px;
      line-height: 1;
      flex-shrink: 0;
      transition: transform 0.2s, color 0.15s;
    }

    .item-card.expanded .ic-toggle { transform: rotate(45deg); color: var(--pc); }

    .ic-detail {
      display: none;
      padding: 12px 16px 16px 48px;
      border-top: 1.5px solid var(--pa);
    }

    .item-card.expanded .ic-detail { display: block; }

    .ic-detail p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.75;
      font-style: italic;
    }

    /* ── Skills ── */
    .skills-section { border-top: 1.5px solid var(--border); padding-top: 24px; }

    .skills-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .skills-chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .skill-chip {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--muted);
      letter-spacing: 0.03em;
      white-space: nowrap;
      display: inline-block;
      text-decoration: none;
    }

    a.skill-chip {
      border-color: var(--accent);
      color: var(--accent);
      transition: background 0.15s, color 0.15s;
    }

    a.skill-chip:hover { background: var(--accent); color: #fff; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      #roadmap { padding: 0 16px 64px; }
      .site-header { padding: 12px 16px; }
      .ph-header { flex-direction: column; }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a class="site-title" href="/">Jenny Faulkner</a>
    <span class="site-breadcrumb">/ Learning</span>
  </div>
</header>

<div id="roadmap"></div>

<script>
var phases = [
  {
    id: 1,
    label: "Phase 01",
    title: "Foundations",
    duration: "Months 1–4",
    color: "#2D6A4F",
    accent: "#B7E4C7",
    icon: "◈",
    summary: "Get coding, get cloud-ready, get data-literate. The bedrock everything else is built on.",
    tracks: [
      {
        name: "Technical Core",
        items: [
          { title: "Python",           detail: "Start with analytical scripting (NumPy, Pandas) and progress to production-grade code: classes, async/await, type hints, packaging, testing. Not just notebooks." },
          { title: "ML fundamentals",  detail: "Supervised/unsupervised learning, model evaluation, bias/variance tradeoff. Andrew Ng’s courses are the gold standard." },
          { title: "LLM literacy",     detail: "Understand transformers conceptually. Read ‘Attention Is All You Need’. Know what tokenization, fine-tuning, and RLHF mean." },
          { title: "AI tooling",       detail: "Hands-on: OpenAI API, LangChain, vector databases (Pinecone/Weaviate), basic RAG pipelines." }
        ]
      },
      {
        name: "Software Engineering",
        items: [
          { title: "Distributed systems fundamentals", detail: "Understand CAP theorem, message queues (Kafka, RabbitMQ), API design (REST, gRPC), and microservices. AI systems are distributed systems." },
          { title: "Cloud infrastructure",             detail: "Pick one cloud deeply: AWS (SageMaker, ECS, Lambda, S3), GCP (Vertex AI, GKE), or Azure (Azure ML, AKS). Get a professional-level cert." },
          { title: "Containerization & orchestration", detail: "Docker from scratch. Kubernetes fundamentals — deployments, services, autoscaling, resource limits. Essential for deploying models at scale." },
          { title: "CI/CD & DevOps",                  detail: "GitHub Actions or CircleCI pipelines. Infrastructure as Code with Terraform. You’ll be setting standards for MLOps pipelines." }
        ]
      },
      {
        name: "Data Engineering",
        items: [
          { title: "Data pipeline design",       detail: "Apache Airflow, dbt, Spark. Understand batch vs. streaming ingestion. Know how to move and transform data reliably at scale." },
          { title: "Storage architecture",       detail: "When to use data lakes (S3/GCS), warehouses (Snowflake/BigQuery), lakehouses (Databricks/Delta Lake), and vector stores (Pinecone/pgvector)." },
          { title: "Schema design & data modeling", detail: "Dimensional modeling, slowly changing dimensions, event sourcing. Bad data architecture will sink any AI system." },
          { title: "Streaming data",             detail: "Kafka or Kinesis for real-time inference pipelines. Many production AI systems need sub-second data freshness." }
        ]
      },
      {
        name: "Milestones",
        items: [
          { title: "Earn 1 cloud architect cert",    detail: "AWS Solutions Architect, GCP Professional Cloud Architect, or Azure Solutions Architect Expert." },
          { title: "Deploy a full-stack app to prod", detail: "Containerized, CI/CD’d, cloud-hosted, monitored. Something you built and own." },
          { title: "Complete 1 ML certification",    detail: "AWS ML Specialty, Google Cloud Professional ML Engineer, or DeepLearning.AI specialization." }
        ]
      }
    ]
  },
  {
    id: 2,
    label: "Phase 02",
    title: "LLM Engineering & Agents",
    duration: "Months 5–9",
    color: "#1D3557",
    accent: "#A8DADC",
    icon: "◉",
    summary: "Get into practical LLM work fast. Models, fine-tuning, RAG, and agents — the core of modern AI engineering.",
    tracks: [
      {
        name: "Model Fundamentals",
        items: [
          { title: "ML theory",                detail: "Linear/logistic regression, decision trees, ensembles, gradient boosting. Know bias-variance, regularization, and cross-validation cold." },
          { title: "Deep learning architecture", detail: "CNNs, RNNs, transformers — understand the math, not just the APIs. Implement a transformer from scratch in PyTorch." },
          { title: "LLMs in depth",            detail: "Pre-training, fine-tuning (SFT, LoRA, QLoRA), RLHF, inference optimization (quantization, speculative decoding). Read the GPT-4 technical report." },
          { title: "Multimodal systems",       detail: "Vision-language models (CLIP, LLaVA), speech (Whisper), image generation (diffusion models)." }
        ]
      },
      {
        name: "MLOps & Production AI",
        items: [
          { title: "Experiment tracking", detail: "MLflow, Weights & Biases, or Neptune. Design the systems teams use for experiment management." },
          { title: "Feature stores",      detail: "Feast, Tecton, or Hopsworks. The bridge between data engineering and ML. Critical for preventing training-serving skew." },
          { title: "Model serving",       detail: "Triton Inference Server, TorchServe, vLLM for LLMs. Latency vs. throughput tradeoffs. GPU memory management." },
          { title: "Model monitoring",    detail: "Data drift, concept drift, performance degradation. Evidently AI, Arize, or custom solutions." }
        ]
      },
      {
        name: "RAG & Agents",
        items: [
          { title: "RAG architecture",          detail: "Advanced RAG: hybrid search, re-ranking, query routing, agentic retrieval. Know when naive RAG fails and how to fix it — chunking strategy, embedding model selection, metadata filtering." },
          { title: "Agentic systems",           detail: "Multi-agent frameworks (LangGraph, AutoGen, CrewAI). Understand orchestration vs. choreography, tool-use patterns, memory architectures, and failure modes." },
          { title: "AI gateway patterns",       detail: "Prompt routing, load balancing across models, fallback chains, cost management, semantic caching. The infrastructure layer most orgs need but few have designed well." },
          { title: "Evaluation architecture",   detail: "LLM-as-judge pipelines, automated test suites, red-teaming infrastructure. Systems for continuous quality measurement." }
        ]
      },
      {
        name: "Milestones",
        items: [
          { title: "Fine-tune and deploy an LLM",    detail: "Use LoRA on an open-source model (Llama, Mistral). Serve it with vLLM behind a FastAPI endpoint. Benchmark latency and throughput." },
          { title: "Build a complete MLOps pipeline", detail: "Data ingestion → training → evaluation → registry → serving → monitoring. Automated retraining on drift." },
          { title: "Ship an agentic application",    detail: "A real multi-step agent using LangGraph or AutoGen. Tool use, memory, error recovery. Not a demo — something that solves a real problem." }
        ]

  {

    label: "Phase 03",
    title: "Systems Design",
    duration: "Months 10–15",
    color: "#7B2D8B",
    accent: "#E0AAFF",
    icon: "◎",
    summary: "Architecture is about tradeoffs at scale. Design systems that are reliable, observable, and evolvable.",
    tracks: [
      {
        name: "AI System Patterns",
        items: [
          { title: "Human-in-the-loop design", detail: "When and how to insert human review. Confidence thresholds, escalation paths, feedback loops for retraining. Critical for regulated industries." },
          { title: "AI platform strategy",     detail: "Build vs. buy decisions at the org level. How to sequence investments: data foundation first, then training infrastructure, then serving, then tooling." },
          { title: "Cost architecture",        detail: "GPU cost modeling, spot instance strategies, inference cost per token, make vs. buy decisions. Architects who ignore cost get fired." }
        ]
      },
      {
        name: "Reliability & Scale",
        items: [
          { title: "High-availability AI systems", detail: "Multi-region model serving, failover strategies, circuit breakers. SLA design for AI — latency SLOs are different from traditional services." },
          { title: "Security for AI systems",      detail: "Prompt injection defense, model exfiltration risks, PII leakage in training data, audit logging. SOC2 and ISO27001 implications." },
          { title: "Observability",                detail: "Distributed tracing for AI pipelines (OpenTelemetry), LLM-specific metrics (token usage, latency percentiles, refusal rates), dashboards." }
        ]
      },
      {
        name: "Architecture Docs",
        items: [
          { title: "ADR practice",          detail: "Architecture Decision Records. Document why you made each major choice. Architects who can’t explain their decisions don’t last." },
          { title: "C4 model diagrams",     detail: "Context, Container, Component, Code diagrams. Master PlantUML or Mermaid for version-controlled diagrams." },
          { title: "RFCs and design reviews", detail: "Learn to write Request for Comment documents and run architecture review boards. You’ll spend as much time in review as in design." }
        ]
      },
      {
        name: "Milestones",
        items: [
          { title: "Design a production-grade AI platform", detail: "Full architecture: data layer, training infrastructure, serving, monitoring, governance. Write the ADRs. Present to engineering leadership." },
          { title: "Contribute to open source",             detail: "PR to LangChain, LlamaIndex, vLLM, or similar. Shows you can work in complex codebases and builds community reputation." }
        ]
      }
    ]
  },
  {
    id: 4,
    label: "Phase 04",
    title: "Depth & Specialisation",
    duration: "Month 16+",
    color: "#B5451B",
    accent: "#FFDDD2",
    icon: "◐",
    summary: "You’ve earned the right to specialise. Pick a vertical, go deep on governance, and start packaging your expertise.",
    tracks: [
      {
        name: "Choose Your Vertical",
        items: [
          { title: "Healthcare AI",       detail: "Clinical decision support, medical imaging, patient data. Requires HIPAA literacy and clinical workflow knowledge." },
          { title: "Financial Services",  detail: "Fraud detection, algorithmic risk, NLP for documents. High regulation — know your compliance." },
          { title: "Retail & E-commerce", detail: "Recommendation engines, demand forecasting, AI-driven personalization." },
          { title: "Enterprise / Ops",    detail: "Process automation, AI agents for internal tooling, knowledge management. Broadest market." }
        ]
      },
      {
        name: "Advanced Expertise",
        items: [
          { title: "AI strategy",                    detail: "Learn to present AI investment cases at the C-suite level. Read about enterprise change management and technology adoption curves." },
          { title: "Responsible AI & governance",    detail: "EU AI Act, model risk management, bias auditing. Compliance knowledge is increasingly a table-stakes requirement." },
          { title: "Build vs. buy frameworks",       detail: "Help orgs decide: fine-tune, prompt-engineer, or buy a SaaS tool. Map total cost of ownership across options." },
          { title: "Technical standards",            detail: "Write the org’s AI architecture principles. Model cards, data sheets, deployment checklists, incident runbooks." }
        ]
      },
      {
        name: "Milestones",
        items: [
          { title: "Develop a signature framework", detail: "Create your own ‘AI Readiness Assessment’ or ‘Use Case Prioritization Matrix’. Own language = perceived expertise." },
          { title: "Publish technical writing",     detail: "Engineering blog posts on architecture decisions, postmortems, benchmarks. Builds credibility and sharpens thinking." },
          { title: "Give a talk",                   detail: "Start local: meetups, industry associations, webinars. Working toward a real conference submission." }
        ]

];

// Skills with corresponding vault pages get <a> tags; all others stay <span>
var linkedSkills = {
  "Python":      "/Learning/Python/",
  "LLM literacy": "/Learning/LLMs/"
};

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function dedup(items) {
  var seen = {};
  return items.filter(function (i) {
    if (seen[i.title]) return false;
    seen[i.title] = true;
    return true;
  });
}

function chipHtml(item) {
  var href = linkedSkills[item.title];
  var label = esc(item.title);
  return href
    ? "<a href=\"" + href + "\" class=\"skill-chip\">" + label + "</a>"
    : "<span class=\"skill-chip\">" + label + "</span>";
}

function renderPhasePanel(p, pi) {
  var allItems = [];
  p.tracks.forEach(function (t) { t.items.forEach(function (i) { allItems.push(i); }); });
  var skills = dedup(allItems);

  var trackBtns = p.tracks.map(function (t, ti) {
    return "<button class=\"track-btn" + (ti === 0 ? " active" : "") + "\" data-track=\"" + ti + "\">" + esc(t.name) + "</button>";
  }).join("");

  var trackPanels = p.tracks.map(function (t, ti) {
    var items = t.items.map(function (item, ii) {
      var n = String(ii + 1).length === 1 ? "0" + (ii + 1) : String(ii + 1);
      return [
        "<div class=\"item-card\" data-item=\"" + ii + "\">",
          "<div class=\"ic-header\">",
            "<div class=\"ic-left\">",
              "<span class=\"ic-num\">" + n + "</span>",
              "<span class=\"ic-title\">" + esc(item.title) + "</span>",
            "</div>",
            "<span class=\"ic-toggle\">+</span>",
          "</div>",
          "<div class=\"ic-detail\"><p>" + esc(item.detail) + "</p></div>",
        "</div>"
      ].join("");
    }).join("");

    return "<div class=\"track-panel" + (ti === 0 ? " active" : "") + "\" data-track=\"" + ti + "\">" + items + "</div>";
  }).join("");

  var chipsList = skills.map(chipHtml).join("");

  var style = "style=\"--pc:" + p.color + ";--pa:" + p.accent + "\"";

  return [
    "<div class=\"phase-panel" + (pi === 0 ? " active" : "") + "\" data-phase=\"" + pi + "\" " + style + ">",
      "<div class=\"ph-header\">",
        "<div class=\"ph-icon\">" + p.icon + "</div>",
        "<div class=\"ph-info\">",
          "<div class=\"ph-title-row\">",
            "<h2 class=\"ph-title\">" + esc(p.title) + "</h2>",
            "<span class=\"ph-badge\">" + esc(p.duration) + "</span>",
          "</div>",
          "<p class=\"ph-summary\">" + esc(p.summary) + "</p>",
        "</div>",
      "</div>",
      "<div class=\"track-tabs\">" + trackBtns + "</div>",
      trackPanels,
      "<div class=\"skills-section\">",
        "<div class=\"skills-label\">All Skills</div>",
        "<div class=\"skills-chips\">" + chipsList + "</div>",
      "</div>",
    "</div>"
  ].join("");
}

function render() {
  var phaseBtns = phases.map(function (p, i) {
    var style = "style=\"--pc:" + p.color + ";--pa:" + p.accent + "\"";
    return [
      "<button class=\"phase-btn" + (i === 0 ? " active" : "") + "\" data-phase=\"" + i + "\" " + style + ">",
        "<div class=\"pb-label\">" + esc(p.label) + "</div>",
        "<div class=\"pb-title\">" + esc(p.title) + "</div>",
        "<div class=\"pb-duration\">" + esc(p.duration) + "</div>",
        "<div class=\"pb-bar\"></div>",
      "</button>"
    ].join("");
  }).join("");

  var panels = phases.map(renderPhasePanel).join("");

  document.getElementById("roadmap").innerHTML = [
    "<div class=\"rm-header\">",
      "<div class=\"rm-eyebrow\">Personal Learning Path</div>",
      "<h1 class=\"rm-title\">AI Roadmap</h1>",
      "<p class=\"rm-subtitle\">A hybrid path combining AI engineering and architecture. Journal notes kept in Obsidian.</p>",
    "</div>",
    "<div class=\"phase-selector\">" + phaseBtns + "</div>",
    "<div class=\"rm-body\">" + panels + "</div>"
  ].join("");

  // ── Interactivity ──
  document.getElementById("roadmap").addEventListener("click", function (e) {
    // Let skill-chip anchor clicks pass through normally
    if (e.target.closest("a.skill-chip")) return;

    // Phase button
    var phaseBtn = e.target.closest(".phase-btn");
    if (phaseBtn) {
      var pi = phaseBtn.dataset.phase;
      this.querySelectorAll(".phase-btn").forEach(function (b) {
        b.classList.toggle("active", b.dataset.phase === pi);
      });
      this.querySelectorAll(".phase-panel").forEach(function (p) {
        p.classList.toggle("active", p.dataset.phase === pi);
      });
      return;
    }

    // Track button
    var trackBtn = e.target.closest(".track-btn");
    if (trackBtn) {
      var phasePanel = trackBtn.closest(".phase-panel");
      var ti = trackBtn.dataset.track;
      phasePanel.querySelectorAll(".track-btn").forEach(function (b) {
        b.classList.toggle("active", b.dataset.track === ti);
      });
      phasePanel.querySelectorAll(".track-panel").forEach(function (p) {
        p.classList.toggle("active", p.dataset.track === ti);
      });
      phasePanel.querySelectorAll(".item-card.expanded").forEach(function (c) {
        c.classList.remove("expanded");
      });
      return;
    }

    // Item card
    var itemCard = e.target.closest(".item-card");
    if (itemCard) {
      var trackPanel = itemCard.closest(".track-panel");
      var wasExpanded = itemCard.classList.contains("expanded");
      trackPanel.querySelectorAll(".item-card.expanded").forEach(function (c) {
        c.classList.remove("expanded");
      });
      if (!wasExpanded) itemCard.classList.add("expanded");
    }
  });
}

render();
</script>

</body>
</html>
