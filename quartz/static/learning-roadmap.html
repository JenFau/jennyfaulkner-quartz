<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Roadmap — Jenny Faulkner</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" />
  <script>
    // Match Quartz's saved-theme before first paint to avoid flash of wrong theme
    (function () {
      var t = localStorage.getItem("theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.dataset.theme = "dark";
      }
    }());
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Colour tokens ── */
    :root {
      --bg:          #ffffff;
      --text:        #111111;
      --accent:      #C4622D;
      --border:      #e8e8e8;
      --border-item: #e8e8e8;
      --muted:       #aaaaaa;
      --card:        #ffffff;
      --subtle:      #f5f5f5;
    }

    /* Dark mode — set by early-JS reading Quartz's localStorage key */
    [data-theme="dark"] {
      --bg:          #1a1a1a;
      --text:        #f0f0f0;
      --accent:      #d4834d;
      --border:      #444444;
      --border-item: #3a3a3a;
      --muted:       #aaaaaa;
      --card:        #2a2a2a;
      --subtle:      #242424;
    }

    /* OS-level fallback when no Quartz theme is saved */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:          #1a1a1a;
        --text:        #f0f0f0;
        --accent:      #d4834d;
        --border:      #444444;
        --border-item: #3a3a3a;
        --muted:       #aaaaaa;
        --card:        #2a2a2a;
        --subtle:      #242424;
      }
    }

    /* ── Base ── */
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Cabinet Grotesk", system-ui, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Site header ── */
    .site-header {
      border-bottom: 1.5px solid var(--border);
      padding: 14px 32px;
    }

    .site-header-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .site-title {
      font-family: "Cabinet Grotesk", sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .site-title:hover { color: var(--accent); }

    .site-breadcrumb {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* ── Page container ── */
    #roadmap {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 32px 80px;
    }

    /* ── Roadmap header ── */
    .rm-header {
      padding: 36px 0 28px;
      border-bottom: 1.5px solid var(--border);
    }

    .rm-eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .rm-title {
      font-family: "Clash Display", sans-serif;
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 12px;
    }

    .rm-subtitle {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── Section selector ── */
    .phase-selector {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 20px 0;
      border-bottom: 1.5px solid var(--border);
    }

    @media (max-width: 700px) {
      .phase-selector { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 450px) {
      .phase-selector { grid-template-columns: repeat(2, 1fr); }
    }

    .phase-btn {
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--card);
      border-radius: 8px;
      text-align: left;
      padding: 14px 16px;
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
      color: var(--text);
    }

    .phase-btn:hover {
      border-color: var(--muted);
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transform: translateY(-1px);
    }

    .phase-btn.active { border-color: var(--pc); box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

    .pb-title {
      font-family: "Cabinet Grotesk", sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .phase-btn.active .pb-title { color: var(--text); }

    .pb-bar {
      display: none;
      margin-top: 8px;
      height: 2px;
      background: var(--pc);
      border-radius: 1px;
    }

    .phase-btn.active .pb-bar { display: block; }

    /* ── Section panels ── */
    .rm-body { padding-top: 28px; }
    .phase-panel { display: none; }
    .phase-panel.active { display: block; }

    /* ── Section header ── */
    .ph-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1.5px solid var(--border);
    }

    .ph-icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 8px;
      background: var(--pa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--pc);
    }

    .ph-info { flex: 1; min-width: 0; }

    .ph-title-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .ph-title {
      font-family: "Cabinet Grotesk", sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .ph-summary {
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.65;
      font-style: italic;
      max-width: 520px;
    }

    /* ── Item cards ── */
    .items-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px; }

    .item-card {
      border: 1.5px solid var(--border-item);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background: var(--subtle);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .item-card:hover { border-color: var(--muted); box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
    .item-card.expanded { border-color: var(--pc); }

    .ic-header {
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      user-select: none;
    }

    .ic-left { display: flex; align-items: center; gap: 12px; }

    .ic-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      min-width: 20px;
      border-radius: 50%;
      background: var(--pa);
      font-family: "JetBrains Mono", monospace;
      font-size: 8px;
      font-weight: 500;
      color: var(--pc);
      flex-shrink: 0;
    }

    .ic-title { font-size: 14px; color: var(--text); letter-spacing: 0.01em; }

    a.ic-title {
      text-decoration: none;
    }

    a.ic-title:hover {
      color: var(--pc);
      text-decoration: underline;
    }

    .ic-toggle {
      color: var(--border);
      font-size: 20px;
      line-height: 1;
      flex-shrink: 0;
      transition: transform 0.2s, color 0.15s;
    }

    .item-card.expanded .ic-toggle { transform: rotate(45deg); color: var(--pc); }

    .ic-detail {
      display: none;
      padding: 12px 16px 16px 48px;
      border-top: 1.5px solid var(--pa);
    }

    .item-card.expanded .ic-detail { display: block; }

    .ic-detail p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.75;
      font-style: italic;
    }


    /* ── Responsive ── */
    @media (max-width: 600px) {
      #roadmap { padding: 0 16px 64px; }
      .site-header { padding: 12px 16px; }
      .ph-header { flex-direction: column; }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a class="site-title" href="/">Jenny Faulkner</a>
    <span class="site-breadcrumb">/ Learning</span>
  </div>
</header>

<div id="roadmap"></div>

<script>
var sections = [
  {
    title: "AI Literacy",
    color: "#2D6A4F",
    accent: "#B7E4C7",
    icon: "◈",
    summary: "Orient yourself in the AI landscape. Build the conceptual fluency to evaluate AI systems, vendors, and use cases with confidence.",
    items: [
      { title: "What AI is (and is not)", detail: "A clear-eyed map of the AI landscape: narrow AI vs. general AI, generative vs. predictive, symbolic vs. statistical. Understand the difference between hype and genuine capability — and how to tell them apart in vendor conversations." },
      { title: "LLMs fundamentals", detail: "Conceptual understanding of transformers, tokenisation, context windows, temperature, and why LLMs hallucinate. Not the mathematics — the mental model needed to reason about model behaviour and set appropriate expectations." },
      { title: "Key terminology", detail: "The vocabulary of AI: tokens, embeddings, inference, fine-tuning, RAG, agents, grounding, alignment. Fluency here means you can participate fully in technical discussions without needing a translator." },
      { title: "Models – frontier vs open source (open weight)", detail: "The major frontier model providers — OpenAI (GPT series), Anthropic (Claude), Google (Gemini) — alongside open-weight alternatives: Meta's Llama, Mistral, Qwen, and others. Understand the trade-offs between frontier capability, cost, privacy, and the flexibility of self-hosted models for specific use cases." },
      { title: "AI tooling landscape", detail: "A map of the layers: model APIs, orchestration frameworks (LangChain, LlamaIndex), vector databases, AI gateways, observability tools. You don't need to build with these — you need to know what each layer does and why it exists." },
      { title: "End-user AI tools landscape", detail: "The growing landscape of AI-powered products: Copilot, Cursor, Notion AI, Harvey, and sector-specific tools. Understanding what's available as off-the-shelf vs. what requires custom development is a core business evaluation skill." },
      { title: "Use case identification", detail: "Frameworks for identifying where AI creates genuine value vs. where it's a solution looking for a problem. Effort/impact matrices, feasibility assessment, and how to build a business case for AI investment." },
      { title: "ROI and business case", detail: "Quantifying AI value: productivity gains, cost reduction, revenue impact. How to structure an investment case, model total cost of ownership, and avoid common ROI pitfalls — inflated productivity claims, hidden implementation costs, and the difficulty of attributing outcomes to AI specifically." },
      { title: "AI strategy fundamentals", detail: "How organisations approach AI adoption: the crawl/walk/run model, the data foundation prerequisite, common failure modes. Learn to present AI investment cases in language that resonates at C-suite level." },
      { title: "Build vs buy vs prompt", detail: "The core decision framework for AI initiatives: when to use a frontier model out of the box, when prompt engineering is sufficient, when fine-tuning adds value, and when a custom solution is justified." }
    ]
  },
  {
    title: "Practical use of AI",
    color: "#1D5C7B",
    accent: "#A8D8E8",
    icon: "◉",
    summary: "Develop hands-on capability with AI tools, frameworks, and deployment patterns — from prompting through to production systems.",
    items: [
      { title: "Prompt engineering", detail: "Systematic prompting: zero-shot, few-shot, chain-of-thought, role prompting, output formatting. The ability to get reliable, structured output from LLMs is a fundamental skill for anyone directing AI work." },
      { title: "Practical use of AI tools", detail: "Regular hands-on use of Claude, ChatGPT, Gemini and relevant domain tools. The goal is intuition — understanding how these systems behave, where they fail, and what kinds of tasks they genuinely accelerate." },
      { title: "Workflow automation and AI integration", detail: "n8n, Zapier, Make — building AI-powered workflows without code: triggers, actions, LLM nodes, connecting APIs. The practical layer between frontier models and real business processes, and increasingly what clients mean when they ask for AI implementation." },
      { title: "Python", detail: "Enough Python to read and run notebooks, interrogate datasets, and understand what engineers are doing. Not production engineering — the literacy to collaborate with technical teams and not be dependent on them for simple data tasks." },
      { title: "RAG", detail: "How RAG works: chunking, embedding, retrieval, re-ranking, generation. Why it exists (knowledge cutoffs, hallucination reduction, proprietary data). When it's the right approach and when it's being over-applied." },
      { title: "Agentic systems", detail: "Multi-step AI agents: tool use, memory architectures, orchestration patterns. LangGraph, AutoGen, CrewAI — what they are and when you'd choose each. Understanding failure modes is as important as understanding capabilities." },
      { title: "Evaluation architecture", detail: "How to measure whether an AI system is actually working: LLM-as-judge pipelines, automated test suites, human evaluation design. The question 'how do we know it's good?' should be answered before you deploy." },
      { title: "Cloud infrastructure concepts", detail: "Enough cloud knowledge to read an architecture diagram and participate in infrastructure decisions: compute, storage, networking, managed services. AWS, GCP, and Azure at a conceptual level — not for certification." },
      { title: "Containerisation and orchestration concepts", detail: "What Docker and Kubernetes do and why they matter for AI deployment. Understanding resource limits, autoscaling, and deployment patterns at the level needed to challenge engineering proposals." },
      { title: "Security for AI systems", detail: "Prompt injection, model exfiltration, PII leakage in training data, audit logging. The threat surface specific to AI systems and what good security practice looks like — from an evaluation and governance perspective." },
      { title: "Observability", detail: "How AI systems are monitored in production: distributed tracing, LLM-specific metrics (token usage, latency, refusal rates), drift detection. Understanding observability helps you ask the right questions about operational readiness." }
    ]
  },
  {
    title: "Data & ML",
    color: "#1D3557",
    accent: "#A8DADC",
    icon: "◎",
    summary: "Understand how AI systems are built, trained, and operated — and develop the technical depth to evaluate and challenge the decisions that go into them.",
    items: [
      { title: "Core ML concepts", detail: "Supervised vs. unsupervised learning, classification vs. regression, clustering. How models learn from data: loss functions, gradient descent, training vs. validation vs. test sets. The conceptual foundation for everything else." },
      { title: "Model evaluation", detail: "Accuracy, precision, recall, F1, AUC-ROC — what these metrics mean in practice and which matter for which business problems. How to interpret model performance reports without being misled by cherry-picked metrics." },
      { title: "Overfitting, bias and variance", detail: "Why models fail to generalise, what training data quality means, and the fundamental tension between model complexity and reliability. Essential for evaluating whether an AI system will hold up in production." },
      { title: "Fine tuning vs prompting", detail: "When fine-tuning a model adds genuine value over prompt engineering alone. The data requirements, cost implications, and trade-offs involved. How LoRA and parameter-efficient fine-tuning work conceptually." },
      { title: "How LLMs are trained", detail: "Pre-training on large corpora, supervised fine-tuning (SFT), reinforcement learning from human feedback (RLHF). Understanding these stages helps you reason about model behaviour, alignment, and the cost of training custom models." },
      { title: "Inference and optimisation", detail: "What happens at inference time: quantisation, batching, speculative decoding, GPU memory constraints. You won't tune these yourself — but understanding the trade-offs between latency, throughput, and cost is essential for architecture conversations." },
      { title: "Multimodal models", detail: "Vision-language models, speech recognition (Whisper), image generation (diffusion models). The expanding capability surface of AI and what it means for the range of problems you can now address." },
      { title: "Data pipelines", detail: "How data moves from source to model: ingestion, transformation, validation, and storage. Batch vs. streaming. Understanding pipelines helps you identify where AI systems can break and where data quality problems originate." },
      { title: "Storage architecture", detail: "Data lakes, warehouses, lakehouses, and vector stores — when each is appropriate and what the trade-offs are. You need to be able to read and challenge storage architecture decisions, not design them." },
      { title: "Data quality and lineage", detail: "Why data quality is the single biggest predictor of AI system success. What lineage means, how to think about data governance, and what questions to ask when a team presents their data strategy." }
    ]
  },
  {
    title: "Governance, Risk and Decision Frameworks",
    shortTitle: "Governance & Risk",
    color: "#7B2D8B",
    accent: "#E0AAFF",
    icon: "◐",
    summary: "Apply technical understanding and business experience to the decisions that matter most: governance, risk, ethics, and organisational AI investment.",
    items: [
      { title: "Regulatory landscape", detail: "EU AI Act, GDPR implications for AI, sector-specific regulation (financial services, healthcare). Understanding risk tiers, prohibited uses, and compliance obligations — at the level needed to advise organisations and engage with legal teams." },
      { title: "Model risk management", detail: "How to assess and communicate AI risk: model validation, performance degradation risk, third-party model risk, concentration risk. MRM frameworks from financial services are increasingly being applied across sectors." },
      { title: "AI governance frameworks", detail: "What good governance looks like in practice: model cards, data sheets, deployment checklists, incident runbooks, review boards. The difference between governance as theatre and governance as a genuine control mechanism." },
      { title: "Technical standards", detail: "Writing and applying AI architecture principles at an organisational level. How to turn governance intent into engineering standards that teams will actually follow." },
      { title: "Bias in AI systems", detail: "Types of bias: data bias, algorithmic bias, feedback loops, representation gaps. How to identify bias, the business and legal risks it creates, and what mitigation approaches are credible vs. performative." },
      { title: "Fairness, accountability, transparency", detail: "The core principles of responsible AI translated into practical constraints: explainability requirements, audit processes, who is accountable when a model causes harm. How these principles translate into engineering and product decisions." },
      { title: "AI safety concepts", detail: "Alignment, RLHF, Constitutional AI, red-teaming. Not at a research level — but understanding the approaches being used to make AI systems safer and the limitations of each." },
      { title: "AI investment sequencing", detail: "How to advise organisations on the order of AI investments: data foundation first, then infrastructure, then tooling, then advanced capability. The common mistake of skipping foundations for visible AI features." },
      { title: "Total cost of ownership", detail: "The full cost picture for AI systems: compute, human review, maintenance, retraining, compliance, and failure costs. TCO analysis for build vs. buy vs. prompt decisions." },
      { title: "AI readiness assessment", detail: "A structured framework for evaluating whether an organisation is ready to deploy AI: data maturity, talent, governance, infrastructure, and change management. The diagnostic tool that precedes strategy." },
      { title: "Use case prioritisation", detail: "Frameworks for ranking AI opportunities: value, feasibility, data availability, risk, strategic alignment. How to build a roadmap that sequences quick wins alongside strategic investments." }
    ]
  },
  {
    title: "Architecture Literacy",
    color: "#B5451B",
    accent: "#FFDDD2",
    icon: "◑",
    summary: "Develop the skills to read, contribute to, and challenge AI system architecture decisions.",
    items: [
      { title: "Reading and writing ADRs", detail: "Architecture Decision Records: understanding the format, evaluating the reasoning, and contributing to the decisions. You don't need to write ADRs from scratch — you need to be a credible participant in architecture reviews." },
      { title: "C4 model diagrams", detail: "Context, Container, Component, Code diagrams. Being able to read and produce C4 diagrams is the lingua franca of architecture communication — essential for bridging business and technical conversations." },
      { title: "Human in the loop design", detail: "When and how to insert human review into AI workflows. Confidence thresholds, escalation paths, feedback loops for retraining. Critical for regulated industries and high-stakes decisions." }
    ]
  }
];

// Skills with vault pages: title becomes a link in the card header
var linkedSkills = {
  "What AI is (and is not)":                        "/Learning/What-AI-is",
  "LLMs fundamentals":                              "/Learning/How-LLMs-work",
  "Key terminology":                                "/Learning/Key-Terminology/",
  "Models – frontier vs open source (open weight)": "/Learning/Frontier-Models/",
  "Python":                                         "/Learning/Python/",
  "Inference and optimisation":                     "/Learning/Inference-and-optimisation/",
  "AI tooling landscape":                           "/Learning/AI-Tooling-Landscape/"
};

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderSectionPanel(s, si) {
  var itemsHtml = s.items.map(function (item, ii) {
    var n = ii < 9 ? "0" + (ii + 1) : String(ii + 1);
    var href = linkedSkills[item.title];
    var titleHtml = href
      ? "<a href=\"" + href + "\" class=\"ic-title\">" + esc(item.title) + "</a>"
      : "<span class=\"ic-title\">" + esc(item.title) + "</span>";
    return [
      "<div class=\"item-card\" data-item=\"" + ii + "\">",
        "<div class=\"ic-header\">",
          "<div class=\"ic-left\">",
            "<span class=\"ic-num\">" + n + "</span>",
            titleHtml,
          "</div>",
          "<span class=\"ic-toggle\">+</span>",
        "</div>",
        "<div class=\"ic-detail\"><p>" + esc(item.detail) + "</p></div>",
      "</div>"
    ].join("");
  }).join("");

  var style = "style=\"--pc:" + s.color + ";--pa:" + s.accent + "\"";

  return [
    "<div class=\"phase-panel" + (si === 0 ? " active" : "") + "\" data-phase=\"" + si + "\" " + style + ">",
      "<div class=\"ph-header\">",
        "<div class=\"ph-icon\">" + s.icon + "</div>",
        "<div class=\"ph-info\">",
          "<div class=\"ph-title-row\">",
            "<h2 class=\"ph-title\">" + esc(s.title) + "</h2>",
          "</div>",
          "<p class=\"ph-summary\">" + esc(s.summary) + "</p>",
        "</div>",
      "</div>",
      "<div class=\"items-list\">" + itemsHtml + "</div>",
    "</div>"
  ].join("");
}

function render() {
  var sectionBtns = sections.map(function (s, i) {
    var style = "style=\"--pc:" + s.color + ";--pa:" + s.accent + "\"";
    return [
      "<button class=\"phase-btn" + (i === 0 ? " active" : "") + "\" data-phase=\"" + i + "\" " + style + ">",
        "<div class=\"pb-title\">" + esc(s.shortTitle || s.title) + "</div>",
        "<div class=\"pb-bar\"></div>",
      "</button>"
    ].join("");
  }).join("");

  var panels = sections.map(renderSectionPanel).join("");

  document.getElementById("roadmap").innerHTML = [
    "<div class=\"rm-header\">",
      "<div class=\"rm-eyebrow\">Personal Learning Path</div>",
      "<h1 class=\"rm-title\">AI Roadmap</h1>",
      "<p class=\"rm-subtitle\">A hybrid path combining AI engineering and architecture. Notes and projects kept in Obsidian.</p>",
    "</div>",
    "<div class=\"phase-selector\">" + sectionBtns + "</div>",
    "<div class=\"rm-body\">" + panels + "</div>"
  ].join("");

  document.getElementById("roadmap").addEventListener("click", function (e) {
    // Let linked titles navigate without toggling the card
    if (e.target.closest("a.ic-title")) return;

    // Section button
    var phaseBtn = e.target.closest(".phase-btn");
    if (phaseBtn) {
      var pi = phaseBtn.dataset.phase;
      this.querySelectorAll(".phase-btn").forEach(function (b) {
        b.classList.toggle("active", b.dataset.phase === pi);
      });
      this.querySelectorAll(".phase-panel").forEach(function (p) {
        p.classList.toggle("active", p.dataset.phase === pi);
      });
      return;
    }

    // Item card
    var itemCard = e.target.closest(".item-card");
    if (itemCard) {
      var itemsList = itemCard.closest(".items-list");
      var wasExpanded = itemCard.classList.contains("expanded");
      itemsList.querySelectorAll(".item-card.expanded").forEach(function (c) {
        c.classList.remove("expanded");
      });
      if (!wasExpanded) itemCard.classList.add("expanded");
    }
  });
}

render();

// ── Theme sync ──
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
}

window.addEventListener("storage", function (e) {
  if (e.key === "theme" && (e.newValue === "dark" || e.newValue === "light")) {
    applyTheme(e.newValue);
  }
});

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
  if (!localStorage.getItem("theme")) {
    applyTheme(e.matches ? "dark" : "light");
  }
});
</script>

</body>
